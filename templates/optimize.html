<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 ML Optimization - Trading Bot</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .optimize-form {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #e0e0e0;
        }
        
        input, select {
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #00ff88;
        }
        
        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #000;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }
        
        .progress-panel {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
        }
        
        .progress-panel.show {
            display: block;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88 0%, #00cc6a 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
        }
        
        .results-panel {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
        }
        
        .results-panel.show {
            display: block;
        }
        
        .best-params {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .param-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .param-item:last-child {
            border-bottom: none;
        }
        
        .param-name {
            font-weight: bold;
        }
        
        .param-value {
            color: #00ff88;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #00ff88;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar" style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 15px; padding: 15px 25px; margin-bottom: 30px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
            <a href="/" style="padding: 10px 20px; background: rgba(255, 255, 255, 0.1); border-radius: 8px; text-decoration: none; color: #fff; font-weight: bold;">🏠 Accueil</a>
            <a href="/dashboard/charts" style="padding: 10px 20px; background: rgba(255, 255, 255, 0.1); border-radius: 8px; text-decoration: none; color: #fff; font-weight: bold;">📊 Dashboard</a>
            <a href="/analytics" style="padding: 10px 20px; background: rgba(255, 255, 255, 0.1); border-radius: 8px; text-decoration: none; color: #fff; font-weight: bold;">📈 Analytics</a>
            <a href="/backtest" style="padding: 10px 20px; background: rgba(255, 255, 255, 0.1); border-radius: 8px; text-decoration: none; color: #fff; font-weight: bold;">🔄 Backtest</a>
            <a href="/optimize" style="padding: 10px 20px; background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%); border-radius: 8px; text-decoration: none; color: #000; font-weight: bold;">🤖 ML Optimize</a>
            <a href="/settings" style="padding: 10px 20px; background: rgba(255, 255, 255, 0.1); border-radius: 8px; text-decoration: none; color: #fff; font-weight: bold;">⚙️ Paramètres</a>
        </div>
        
        <h1>🤖 ML Optimization (Optuna)</h1>
        
        <div class="optimize-form">
            <h2 style="margin-bottom: 20px;">Configuration Optimisation</h2>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Symboles (séparés par virgule)</label>
                    <input type="text" id="symbols" placeholder="BTC/USDT:USDT" value="BTC/USDT:USDT">
                </div>
                
                <div class="form-group">
                    <label>Date Début (YYYY-MM-DD)</label>
                    <input type="date" id="startDate" value="2025-01-01">
                </div>
                
                <div class="form-group">
                    <label>Date Fin (YYYY-MM-DD)</label>
                    <input type="date" id="endDate" value="2025-02-01">
                </div>
                
                <div class="form-group">
                    <label>Nombre de Trials</label>
                    <input type="number" id="nTrials" value="50" min="10" max="1000" step="10">
                </div>
                
                <div class="form-group">
                    <label>Capital Initial (USDT)</label>
                    <input type="number" id="initialCapital" value="1000" step="100" min="100">
                </div>
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 25px;">
                <button class="btn btn-primary" onclick="startOptimization()">🚀 Lancer Optimisation</button>
                <button class="btn btn-secondary" onclick="resetForm()">🔄 Réinitialiser</button>
            </div>
        </div>
        
        <div class="progress-panel" id="progressPanel">
            <h2>⏳ Optimisation en cours...</h2>
            <div class="loading">
                <div class="spinner"></div>
                <p id="progressText">Initialisation...</p>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
            </div>
        </div>
        
        <div class="results-panel" id="resultsPanel">
            <h2 style="margin-bottom: 20px;">✅ Meilleurs Paramètres Trouvés</h2>
            
            <div class="best-params" id="bestParams">
                <!-- Rempli dynamiquement -->
            </div>
            
            <div style="margin-top: 20px;">
                <p><strong>Score Objectif:</strong> <span id="bestValue" style="color: #00ff88;">0.00</span></p>
                <p><strong>Trials Effectués:</strong> <span id="nTrialsDone">0</span></p>
            </div>
        </div>
    </div>
    
    <script>
        let optimizationInterval = null;
        
        async function startOptimization() {
            const symbols = document.getElementById('symbols').value.split(',').map(s => s.trim());
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const nTrials = parseInt(document.getElementById('nTrials').value);
            const initialCapital = parseFloat(document.getElementById('initialCapital').value);
            
            if (!symbols.length || !startDate || !endDate) {
                alert('Veuillez remplir tous les champs');
                return;
            }
            
            // Afficher progress
            document.getElementById('progressPanel').classList.add('show');
            document.getElementById('resultsPanel').classList.remove('show');
            
            try {
                // Lancer optimisation
                const response = await fetch('/api/optimize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        symbols: symbols,
                        start_date: startDate,
                        end_date: endDate,
                        n_trials: nTrials,
                        initial_capital: initialCapital
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Erreur lors de l\'optimisation');
                }
                
                if (data.success && data.results) {
                    displayResults(data.results);
                } else {
                    throw new Error('Réponse invalide');
                }
                
            } catch (error) {
                alert('Erreur: ' + error.message);
            } finally {
                document.getElementById('progressPanel').classList.remove('show');
            }
        }
        
        function displayResults(results) {
            const bestParams = results.best_params || {};
            const bestValue = results.best_value || 0;
            const nTrialsDone = results.n_trials || 0;
            
            // Afficher paramètres
            const paramsDiv = document.getElementById('bestParams');
            paramsDiv.innerHTML = '';
            
            for (const [key, value] of Object.entries(bestParams)) {
                const paramItem = document.createElement('div');
                paramItem.className = 'param-item';
                paramItem.innerHTML = `
                    <span class="param-name">${key}</span>
                    <span class="param-value">${typeof value === 'number' ? value.toFixed(4) : value}</span>
                `;
                paramsDiv.appendChild(paramItem);
            }
            
            document.getElementById('bestValue').textContent = bestValue.toFixed(4);
            document.getElementById('nTrialsDone').textContent = nTrialsDone;
            
            document.getElementById('resultsPanel').classList.add('show');
        }
        
        function resetForm() {
            document.getElementById('symbols').value = 'BTC/USDT:USDT';
            document.getElementById('startDate').value = '2025-01-01';
            document.getElementById('endDate').value = '2025-02-01';
            document.getElementById('nTrials').value = '50';
            document.getElementById('initialCapital').value = '1000';
            document.getElementById('resultsPanel').classList.remove('show');
        }
    </script>
</body>
</html>
