<!DOCTYPE html>
<html>
<head>
    <title>Test WebSocket Frontend-Backend</title>
</head>
<body>
    <h1>Test WebSocket Frontend-Backend</h1>
    <div id="status">Connexion en cours...</div>
    <div id="log"></div>

    <script>
        // Test direct de la nouvelle configuration WebSocket
        const log = document.getElementById('log');
        const status = document.getElementById('status');
        
        function addLog(message) {
            const div = document.createElement('div');
            div.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
            log.appendChild(div);
            console.log(message);
        }
        
        // Simuler la détection d'environnement du frontend
        const isDev = window.location.hostname === 'localhost';
        let url;
        
        if (isDev) {
            // Même logique que websocket-impl.ts
            url = 'ws://localhost:5003';
            addLog('🔧 Mode DEV: Connexion WebSocket forcée vers backend Python: ' + url);
        } else {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            url = `${protocol}//${host}`;
            addLog('🔧 Mode PROD: Connexion WebSocket via proxy: ' + url);
        }
        
        const wsUrl = url + '/ws';
        addLog('🎯 WebSocket URL finale construite: ' + wsUrl);
        
        // Test de connexion
        try {
            const ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                addLog('✅ WebSocket connecté avec succès !');
                status.textContent = 'Connecté ✅';
                
                // Test envoi de message
                const testMsg = {
                    type: 'request',
                    id: 'frontend_test',
                    request_type: 'state'
                };
                ws.send(JSON.stringify(testMsg));
                addLog('📤 Message test envoyé');
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                addLog('📥 Réponse reçue: ' + data.type + (data.event ? ' (' + data.event + ')' : ''));
                
                if (data.type === 'request_response' && data.id === 'frontend_test') {
                    addLog('🎯 Réponse au test reçue avec succès !');
                    if (data.data && data.data.success) {
                        addLog('✅ Backend opérationnel, données d\'état reçues');
                    }
                }
            };
            
            ws.onclose = function(event) {
                addLog('⚠️ WebSocket déconnecté: ' + event.code + ' ' + event.reason);
                status.textContent = 'Déconnecté ❌';
            };
            
            ws.onerror = function(error) {
                addLog('❌ Erreur WebSocket: ' + error);
                status.textContent = 'Erreur ❌';
            };
            
        } catch (error) {
            addLog('❌ Erreur création WebSocket: ' + error);
            status.textContent = 'Erreur création ❌';
        }
    </script>
</body>
</html>
