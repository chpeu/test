# docker-compose.yml pour Trade Cursor v7.0
# Permet de lancer facilement plusieurs instances du bot

version: '3.8'

services:
  # Instance 1 - Port 5000
  trade-bot-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: 5000
    container_name: trade-cursor-5000
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - INSTANCE_NAME=trade-bot-1
      # Variables optionnelles (à définir dans .env ou directement ici)
      # - MEXC_API_KEY=${MEXC_API_KEY}
      # - MEXC_API_SECRET=${MEXC_API_SECRET}
    volumes:
      # Persistence des données (logs, historique trades, DB analytics)
      - ./data/instance1:/app/data
      - ./logs/instance1:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/config', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - trade-network

  # Instance 2 - Port 5001 (décommentez pour activer)
  # trade-bot-2:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     args:
  #       PORT: 5001
  #   container_name: trade-cursor-5001
  #   ports:
  #     - "5001:5001"
  #   environment:
  #     - PORT=5001
  #     - INSTANCE_NAME=trade-bot-2
  #   volumes:
  #     - ./data/instance2:/app/data
  #     - ./logs/instance2:/app/logs
  #   restart: unless-stopped
  #   networks:
  #     - trade-network

  # Instance 3 - Port 5002 (décommentez pour activer)
  # trade-bot-3:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     args:
  #       PORT: 5002
  #   container_name: trade-cursor-5002
  #   ports:
  #     - "5002:5002"
  #   environment:
  #     - PORT=5002
  #     - INSTANCE_NAME=trade-bot-3
  #   volumes:
  #     - ./data/instance3:/app/data
  #     - ./logs/instance3:/app/logs
  #   restart: unless-stopped
  #   networks:
  #     - trade-network

networks:
  trade-network:
    driver: bridge

# UTILISATION:
#
# 1. Build les images:
#    docker-compose build
#
# 2. Lancer instance 1 seulement:
#    docker-compose up trade-bot-1
#
# 3. Lancer toutes les instances (après avoir décommenté):
#    docker-compose up
#
# 4. Lancer en arrière-plan:
#    docker-compose up -d
#
# 5. Voir les logs:
#    docker-compose logs -f trade-bot-1
#
# 6. Arrêter:
#    docker-compose down
#
# 7. Rebuild après modifications du code:
#    docker-compose build --no-cache
#    docker-compose up -d
