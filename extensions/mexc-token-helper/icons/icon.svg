<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="key" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00cc6a"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="48" cy="48" r="44" fill="url(#bg)" stroke="#00ff88" stroke-width="2"/>
  
  <!-- Key icon -->
  <g transform="translate(24, 28)" fill="url(#key)">
    <!-- Key head (circle) -->
    <circle cx="12" cy="12" r="10" fill="none" stroke="url(#key)" stroke-width="4"/>
    <circle cx="12" cy="12" r="4" fill="url(#key)"/>
    
    <!-- Key shaft -->
    <rect x="20" y="10" width="24" height="4" rx="2"/>
    
    <!-- Key teeth -->
    <rect x="32" y="14" width="4" height="8" rx="1"/>
    <rect x="38" y="14" width="4" height="6" rx="1"/>
  </g>
  
  <!-- M letter for MEXC -->
  <text x="48" y="72" text-anchor="middle" font-family="Arial Black" font-size="16" fill="#00ff88" font-weight="bold">M</text>
</svg>
