name: Tests & Coverage

on:
  push:
    # claude2 est la branche par défaut du dépôt : sans elle, aucun run sur la branche principale
    branches: [ claude2, main, dev, claude/* ]
  pull_request:
    # Les PR sont ouvertes vers la branche par défaut (claude2), pas vers main qui n'existe pas
    branches: [ claude2, main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=core --cov=api --cov-report=xml --cov-report=term-missing --cov-fail-under=20 -v

    - name: Upload coverage to Codecov (optional)
      if: success()
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
