name: Tests & Coverage

on:
  push:
    # claude2 est la branche par défaut du dépôt : sans elle, aucun run sur la branche principale
    branches: [ claude2, main, dev, claude/* ]
  pull_request:
    # Les PR sont ouvertes vers la branche par défaut (claude2), pas vers main qui n'existe pas
    branches: [ claude2, main, dev ]
  workflow_dispatch:  # permet de relancer un run à la main (un run sans runner n'est pas relançable autrement)

permissions:
  contents: read          # le job ne fait que lire le code : aucune écriture nécessaire

# Un push qui en remplace un autre annule le run devenu obsolète : c'est voulu.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Portique statique : il bloque les classes de bugs déjà corrigées (voir ruff.toml).
    # Séparé du job de tests : il tombe en quelques secondes, sans attendre pip.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ruff
      # Version épinglée : une nouvelle version de ruff ajoute des règles, et un portique
      # qui rougit tout seul sur un changement de dépendance cesse d'être un signal.
      run: python -m pip install --upgrade pip && pip install ruff==0.15.11

    - name: Ruff (règles de correction, périmètre défini dans ruff.toml)
      run: ruff check .

  test:
    needs: lint           # ne pas payer 5 min de tests pour un finding de lint
    runs-on: ubuntu-latest
    timeout-minutes: 20  # borne dure : la suite complète passe en 3 min 09 en local

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=core --cov=api --cov-report=xml --cov-report=term-missing --cov-fail-under=20 -v

    - name: Le chemin des ordres réels reste couvert (porte à 75 %)
      run: |
        pytest tests/test_ordres_reels.py tests/test_ordres_reels_bypass.py tests/test_ordres_reels_protections.py tests/unit/trading tests/test_stop_cote_echange.py -q --cov=trading.live_order_manager_futures --cov-fail-under=75

    - name: La porte d'entrée des trades reste testée (porte à 45 %)
      run: |
        pytest tests/test_analyzer_vivant.py tests/test_analyzer_refactored.py tests/test_unit_analyzer_modules.py tests/test_targeted_coverage.py tests/test_rsi_behavior.py -q --cov=core.analyzer_file --cov-fail-under=45

    - name: Upload coverage to Codecov (optional)
      if: success()
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
