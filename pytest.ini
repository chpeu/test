[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --import-mode=importlib

markers =
    unit: Unit tests for individual modules
    optuna_lourd: tours d'optimisation ML a lancer dans leur propre processus (interne SQLAlchemy)
    integration: Integration tests for combined functionality
    slow: Slow-running tests
